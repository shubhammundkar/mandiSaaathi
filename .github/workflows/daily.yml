name: Daily Mandi Price Collection

on:
  schedule:
    # Runs daily at 14:30 IST (09:00 UTC), after morning APMC auctions close
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Ingestion & Snapshot Refresh
        run: |
          python scripts/daily_update.py

      - name: Commit and Push Refreshed Snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/agmarknet_maharashtra_snapshot.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily mandi snapshot refresh [skip ci]" && git push)
